apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: frontend-prod
spec:
  replicas: 3
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: alyyasser10/project10-frontend:v1
          ports:
            - containerPort: 80
