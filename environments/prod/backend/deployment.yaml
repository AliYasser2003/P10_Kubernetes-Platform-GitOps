apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: backend-prod
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: alyyasser10/project10-backend:v1
          ports:
            - containerPort: 3000
