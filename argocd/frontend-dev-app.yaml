apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frontend-dev
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/AliYasser2003/P10_Kubernetes-Platform-GitOps.git
    targetRevision: HEAD
    path: environments/dev/frontend

  destination:
    server: https://kubernetes.default.svc
    namespace: frontend-dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
